<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mcp-browser watch</title>
  <link rel="stylesheet" href="https://unpkg.com/frankenstyle@latest/dist/css/frankenstyle.min.css" />
  <style>
    :root { --spacing: 0.25rem; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .snapshot-img { image-rendering: auto; }
    .card { cursor: pointer; transition: transform .1s ease; }
    .card:hover { transform: translateY(-2px); }
    .thumb { aspect-ratio: 16 / 9; object-fit: cover; width: 100%; display: block; }
    .hidden { display: none !important; }
    .tab-btn { cursor: pointer; }
    .tab-btn.active { background: #1f2937; border-color: #374151; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.375rem;
      padding: 0.125rem 0.5rem; border-radius: 9999px;
      font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .badge-live { background: #dc2626; color: #fff; }
    .badge-idle { background: #374151; color: #d1d5db; }
    .badge-connecting { background: #b45309; color: #fff; }
    .badge-count { background: #1f2937; color: #9ca3af; }
    .live-frame {
      width: 100%; display: block; aspect-ratio: 16 / 9;
      object-fit: contain; background: #0b0c0f;
      border: 1px solid #1f2937; border-radius: 0.5rem;
    }
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; cursor: zoom-out;
    }
    #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 0.375rem; }
    .gallery-thumb { aspect-ratio: 16 / 9; object-fit: cover; width: 100%; cursor: zoom-in; }
  </style>
</head>
<body class="bg dark:bg color dark:color"
      style="--bg: #0b0c0f; --color: #e5e7eb; --dark-bg: #0b0c0f; --dark-color: #e5e7eb;">
  <div class="p" style="--p: 6;">
    <header class="mb flex flex-wrap justify-between items-center" style="--mb: 6; --gap: 3;">
      <div>
        <h1 class="font-size font-bold" style="--font-size: 1.5rem;">mcp-browser watch</h1>
        <p class="color/o" style="--color: #9ca3af; --color-o: 100%;">Live sessions &amp; screenshots from MCP agents</p>
      </div>
      <div id="auth-row" class="flex items-center" style="--gap: 2;">
        <label class="font-size color/o" style="--font-size: 0.75rem; --color: #6b7280; --color-o: 100%;">API key</label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false"
               placeholder="sk-…"
               class="px py rounded border-w border-solid"
               style="--px:3; --py:1.5; --rounded:0.375rem; --border-w:1px; --border:#374151; --bg:#111318; font-size:0.8125rem;" />
      </div>
    </header>

    <p id="auth-hint" class="hidden mb font-size color/o"
       style="--mb:4; --font-size:0.8125rem; --color:#f59e0b; --color-o:100%;">
      This server requires an API key. Enter it in the field above, then reload the page.
    </p>

    <main>
      <div id="list-view">
        <div id="sessions"
             class="grid-cols gap"
             style="--grid-cols: 1; --gap: 4;">
          <p class="color/o" style="--color: #6b7280; --color-o: 100%;">Loading…</p>
        </div>
      </div>

      <div id="detail-view" class="hidden">
        <button id="back-btn"
                class="mb px py rounded border-w border-solid font-medium"
                style="--mb: 4; --px: 3; --py: 1.5; --rounded: 0.375rem; --border-w: 1px; --border: #374151; --bg: #1f2937;">
          ← Back to sessions
        </button>

        <div class="mb px py border-b-w border-solid"
             style="--mb:4; --px:5; --py:4; --border-b-w:1px; --border-b:#1f2937;">
          <div class="flex flex-wrap justify-between items-center" style="--gap: 3;">
            <div class="flex items-center" style="--gap: 2;">
              <h2 id="detail-title" class="font-size font-bold" style="--font-size:1.125rem;">—</h2>
              <span id="detail-live-badge" class="badge badge-connecting hidden">connecting</span>
            </div>
            <div class="flex" style="--gap: 2;">
              <button id="tab-live" data-view="live" class="tab-btn px py rounded border-w border-solid font-medium active"
                      style="--px:3; --py:1.5; --rounded:0.375rem; --border-w:1px; --border:#374151; --bg:#1f2937;">Live</button>
              <button id="tab-shots" data-view="shots" class="tab-btn px py rounded border-w border-solid font-medium"
                      style="--px:3; --py:1.5; --rounded:0.375rem; --border-w:1px; --border:#374151;">Screenshots</button>
            </div>
          </div>
          <div class="mt font-size color/o"
               style="--mt:2; --font-size:0.875rem; --color:#9ca3af; --color-o:100%;">
            <span id="detail-url">—</span> · <span id="detail-session">—</span>
          </div>
        </div>

        <div id="pane-live" class="p" style="--p:4;">
          <div class="relative mb" style="--mb:3;">
            <img id="live-img" class="live-frame" alt="live view"
                 style="display:none;" />
            <div id="live-placeholder" class="live-frame flex items-center justify-center">
              <span class="color/o" style="--color:#6b7280;--color-o:100%;">Waiting for the live stream…</span>
            </div>
          </div>
          <div class="flex justify-between items-center font-size color/o"
               style="--font-size:0.75rem; --color:#6b7280; --color-o:100%;">
            <span id="live-status">Connecting to live stream…</span>
            <span id="live-updated"></span>
          </div>
        </div>

        <div id="pane-shots" class="hidden p" style="--p:4;">
          <div id="shots-grid" class="grid-cols gap"
               style="--grid-cols: 1; --gap: 4;">
            <p class="color/o" style="--color: #6b7280; --color-o: 100%;">Loading…</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="lightbox" class="hidden" onclick="this.classList.add('hidden');">
    <img id="lightbox-img" src="" alt="screenshot" />
  </div>

  <script>
    (function () {
      const sessionsEl = document.getElementById('sessions');
      const listView   = document.getElementById('list-view');
      const detailView = document.getElementById('detail-view');
      const backBtn    = document.getElementById('back-btn');
      const tabLive    = document.getElementById('tab-live');
      const tabShots   = document.getElementById('tab-shots');
      const paneLive   = document.getElementById('pane-live');
      const paneShots  = document.getElementById('pane-shots');
      const liveImg    = document.getElementById('live-img');
      const livePlaceholder = document.getElementById('live-placeholder');
      const liveStatus = document.getElementById('live-status');
      const liveUpdated = document.getElementById('live-updated');
      const liveBadge  = document.getElementById('detail-live-badge');
      const detailTitle = document.getElementById('detail-title');
      const detailUrl  = document.getElementById('detail-url');
      const detailSession = document.getElementById('detail-session');
      const shotsGrid  = document.getElementById('shots-grid');
      const apiKeyInput = document.getElementById('api-key');
      const authHint   = document.getElementById('auth-hint');

      const WATCH_BASE = location.pathname.replace(/\/$/, '') || '';

      function apiKey() {
        return localStorage.getItem('mcpBrowserApiKey') || '';
      }
      function withAuth(path) {
        const k = apiKey();
        if (!k) return path;
        return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'api_key=' + encodeURIComponent(k);
      }
      apiKeyInput.value = apiKey();
      apiKeyInput.addEventListener('change', function () {
        localStorage.setItem('mcpBrowserApiKey', this.value.trim());
        location.reload();
      });

      function getJSON(path) {
        return fetch(withAuth(path)).then(function (r) {
          if (r.status === 401) {
            authHint.classList.remove('hidden');
            return null;
          }
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
      }

      let currentSessionId = null;
      let currentView = 'live';
      let liveES = null;
      let eventsES = null;
      let lastLiveFrame = 0;
      let idleTimer = null;
      let liveStartedAt = 0;
      let liveErrors = 0;

      // ---------- Home (session list) ----------

      function loadHome() {
        Promise.all([getJSON(WATCH_BASE + '/snapshots'), getJSON(WATCH_BASE + '/sessions')])
          .then(function (res) {
            const summaries = Array.isArray(res[0]) ? res[0] : [];
            const active = Array.isArray(res[1]) ? res[1] : [];
            renderList(summaries, active);
          })
          .catch(function () {
            sessionsEl.innerHTML = '<p class="color/o" style="--color:#6b7280;--color-o:100%;">Failed to load sessions.</p>';
          });
      }

      function renderList(summaries, active) {
        const ids = new Set(summaries.map(function (s) { return s.sessionId; }));
        active.forEach(function (id) { ids.add(id); });
        const entries = Array.from(ids).map(function (id) {
          const s = summaries.find(function (x) { return x.sessionId === id; });
          return {
            id: id,
            summary: s,
            active: active.indexOf(id) >= 0,
            order: s ? new Date(s.timestamp).getTime() : Date.now()
          };
        }).sort(function (a, b) { return b.order - a.order; });

        if (entries.length === 0) {
          sessionsEl.innerHTML = '<p class="color/o" style="--color:#6b7280;--color-o:100%;">No sessions yet. Start an MCP agent session and take a screenshot.</p>';
          return;
        }

        sessionsEl.innerHTML = entries.map(function (e) {
          const s = e.summary;
          const img = s ? ('data:image/png;base64,' + s.image) : '';
          const count = s ? s.count : 0;
          const title = s && s.title ? s.title : (e.active ? 'Active session' : 'Untitled');
          const url = s ? s.url : '';
          const time = s ? timeAgo(s.timestamp) : 'just now';
          return `
            <article class="card bg/o rounded-lg border-w border-solid overflow-hidden"
                     style="--bg:#111318;--bg-o:100%;--border-w:1px;--border:#1f2937;--rounded-lg:0.75rem;"
                     data-session="${escapeHtml(e.id)}">
              ${img
                ? `<img src="${img}" alt="screenshot" class="thumb" style="background:#0b0c0f;" />`
                : `<div class="thumb flex items-center justify-center" style="background:#0d0f13;"><span class="color/o font-size" style="--font-size:0.75rem;--color:#4b5563;--color-o:100%;">no screenshot yet</span></div>`}
              <div class="px py" style="--px:4;--py:3;">
                <div class="flex justify-between items-center" style="--gap:2;">
                  <div class="font-medium truncate" style="font-size:0.9375rem;">${escapeHtml(title)}</div>
                  <span class="badge ${e.active ? 'badge-live' : 'badge-count'}">${e.active ? '● live' : count + ' shot' + (count === 1 ? '' : 's')}</span>
                </div>
                <div class="font-size color/o truncate" style="--font-size:0.75rem;--color:#9ca3af;--color-o:100%;">${escapeHtml(url || '—')}</div>
                <div class="mt flex justify-between items-center" style="--mt:2;">
                  <div class="font-size color/o" style="--font-size:0.75rem;--color:#6b7280;--color-o:100%;">${time}</div>
                  <div class="font-size color/o" style="--font-size:0.75rem;--color:#4b5563;--color-o:100%;">${escapeHtml(e.id)}</div>
                </div>
              </div>
            </article>`;
        }).join('');
      }

      // ---------- Detail page ----------

      function showDetail(sessionId, view) {
        currentSessionId = sessionId;
        currentView = view || 'live';
        history.replaceState(null, '', WATCH_BASE + '/?session=' + encodeURIComponent(sessionId) + '&view=' + currentView);
        listView.classList.add('hidden');
        detailView.classList.remove('hidden');
        setView(currentView);
        refreshDetailHeader(sessionId);
        refreshShots(sessionId);
        if (currentView === 'live') openLiveStream(sessionId);
        startIdleTimer();
      }

      function refreshDetailHeader(sessionId) {
        getJSON(WATCH_BASE + '/snapshots').then(function (summaries) {
          if (!Array.isArray(summaries) || currentSessionId !== sessionId) return;
          const s = summaries.find(function (x) { return x.sessionId === sessionId; });
          detailTitle.textContent = s && s.title ? s.title : 'Active session';
          detailUrl.textContent = s && s.url ? s.url : '—';
          detailSession.textContent = sessionId;
        });
      }

      function setView(view) {
        currentView = view;
        tabLive.classList.toggle('active', view === 'live');
        tabShots.classList.toggle('active', view === 'shots');
        paneLive.classList.toggle('hidden', view !== 'live');
        paneShots.classList.toggle('hidden', view !== 'shots');
        if (view === 'live' && currentSessionId) {
          openLiveStream(currentSessionId);
        } else {
          closeLiveStream();
        }
        history.replaceState(null, '', WATCH_BASE + '/?session=' + encodeURIComponent(currentSessionId) + '&view=' + view);
      }

      tabLive.addEventListener('click', function () { setView('live'); });
      tabShots.addEventListener('click', function () { setView('shots'); });

      // ---------- Live stream ----------

      function openLiveStream(sessionId) {
        closeLiveStream();
        lastLiveFrame = 0;
        liveStartedAt = Date.now();
        liveImg.style.display = 'none';
        livePlaceholder.style.display = 'flex';
        setLiveStatus('Connecting to live stream…', 'connecting');
        liveES = new EventSource(withAuth(WATCH_BASE + '/live/' + encodeURIComponent(sessionId)));
        liveES.onmessage = function (e) {
          liveErrors = 0;
          let f;
          try { f = JSON.parse(e.data); } catch (_) { return; }
          if (f && f.type === 'idle') {
            setLiveStatus('Session inactive', 'idle');
            livePlaceholder.textContent = 'Session inactive — the browser page is no longer available.';
            closeLiveStream();
            return;
          }
          if (!f || !f.image) return;
          lastLiveFrame = Date.now();
          const mime = f.mime || 'image/jpeg';
          liveImg.src = 'data:' + mime + ';base64,' + f.image;
          liveImg.style.display = 'block';
          livePlaceholder.style.display = 'none';
          setLiveStatus('Streaming', 'live');
          liveUpdated.textContent = f.timestamp ? 'updated ' + timeAgo(f.timestamp) : '';
        };
        liveES.onopen = function () {
          liveErrors = 0;
          setLiveStatus('Streaming', 'live');
        };
        liveES.onerror = function () {
          // A server-sent idle frame declares the session inactive; local
          // errors only accumulate when the SSE connection itself fails.
          liveErrors++;
          if (liveErrors >= 3) {
            setLiveStatus('Session inactive', 'idle');
            livePlaceholder.textContent = 'Session inactive — the live stream could not be reached.';
            closeLiveStream();
          } else {
            setLiveStatus('Reconnecting…', 'connecting');
          }
        };
      }

      function closeLiveStream() {
        if (liveES) { liveES.close(); liveES = null; }
      }

      function setLiveStatus(text, kind) {
        liveStatus.textContent = text;
        liveBadge.classList.toggle('hidden', kind === 'live' && lastLiveFrame > 0);
        liveBadge.className = 'badge ' + (kind === 'live' ? 'badge-live' : kind === 'connecting' ? 'badge-connecting' : 'badge-idle');
        if (kind === 'live') liveBadge.textContent = '● LIVE';
        else if (kind === 'connecting') liveBadge.textContent = 'connecting';
        else liveBadge.textContent = 'idle';
      }

      function startIdleTimer() {
        if (idleTimer) clearInterval(idleTimer);
        idleTimer = setInterval(function () {
          if (currentView !== 'live' || !currentSessionId) return;
          if (!liveES) return;
          // Captures pause while a tool (e.g. a navigation) is using the page,
          // so a quiet stream is expected and must not be treated as inactive.
          if (lastLiveFrame > 0 && Date.now() - lastLiveFrame > 8000) {
            setLiveStatus('Page loading — waiting for the next frame…', 'connecting');
          } else if (lastLiveFrame === 0 && Date.now() - liveStartedAt > 8000) {
            setLiveStatus('Page loading — waiting for the first frame…', 'connecting');
          }
        }, 1000);
      }

      // ---------- Screenshots gallery ----------

      function refreshShots(sessionId) {
        getJSON(WATCH_BASE + '/snapshots/' + encodeURIComponent(sessionId)).then(function (hist) {
          if (currentSessionId !== sessionId) return;
          if (!Array.isArray(hist) || hist.length === 0) {
            shotsGrid.innerHTML = '<p class="color/o" style="--color:#6b7280;--color-o:100%;">No screenshots yet for this session.</p>';
            return;
          }
          hist.sort(function (a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });
          shotsGrid.innerHTML = hist.map(function (s) {
            return `
              <article class="bg/o rounded-lg border-w border-solid overflow-hidden"
                       style="--bg:#111318;--bg-o:100%;--border-w:1px;--border:#1f2937;--rounded-lg:0.75rem;"
                       data-full="${'data:image/png;base64,' + s.image}">
                <img src="data:image/png;base64,${s.image}" alt="screenshot" class="gallery-thumb" loading="lazy" />
                <div class="px py flex justify-between items-center" style="--px:3;--py:2;">
                  <div class="font-size color/o" style="--font-size:0.75rem;--color:#6b7280;--color-o:100%;">${timeAgo(s.timestamp)}</div>
                  <div class="font-size color/o" style="--font-size:0.75rem;--color:#4b5563;--color-o:100%;">${escapeHtml(s.toolName || '')}</div>
                </div>
              </article>`;
          }).join('');
        }).catch(function () {
          if (currentSessionId === sessionId) {
            shotsGrid.innerHTML = '<p class="color/o" style="--color:#6b7280;--color-o:100%;">Screenshots are temporarily unavailable.</p>';
          }
        });
      }

      shotsGrid.addEventListener('click', function (e) {
        const card = e.target.closest('[data-full]');
        if (!card) return;
        document.getElementById('lightbox-img').src = card.getAttribute('data-full');
        document.getElementById('lightbox').classList.remove('hidden');
      });

      // Real-time updates for the screenshots gallery.
      function initEvents() {
        if (eventsES) return;
        eventsES = new EventSource(withAuth(WATCH_BASE + '/events'));
        eventsES.onmessage = function (e) {
          let snap;
          try { snap = JSON.parse(e.data); } catch (_) { return; }
          if (!snap) return;
          if (currentSessionId === snap.sessionId) {
            refreshShots(currentSessionId);
            refreshDetailHeader(currentSessionId);
          }
        };
        eventsES.onerror = function () {
          eventsES.close();
          eventsES = null;
          setTimeout(initEvents, 3000);
        };
      }

      function showList() {
        currentSessionId = null;
        closeLiveStream();
        history.replaceState(null, '', WATCH_BASE + '/');
        detailView.classList.add('hidden');
        listView.classList.remove('hidden');
      }

      backBtn.addEventListener('click', showList);

      sessionsEl.addEventListener('click', function (e) {
        const card = e.target.closest('[data-session]');
        if (!card) return;
        showDetail(card.dataset.session, 'live');
      });

      // ---------- Helpers ----------

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (m) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
        });
      }
      function timeAgo(iso) {
        const d = new Date(iso);
        const diff = Math.floor((Date.now() - d.getTime()) / 1000);
        if (diff < 5) return 'just now';
        if (diff < 60) return diff + 's ago';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        return Math.floor(diff / 3600) + 'h ago';
      }

      // ---------- Boot ----------

      const params = new URLSearchParams(location.search);
      const startSession = params.get('session');
      const startView = params.get('view');

      initEvents();
      loadHome();
      const pollTimer = setInterval(function () {
        if (!currentSessionId) loadHome();
      }, 3000);

      if (startSession) showDetail(startSession, startView);
    })();
  </script>
</body>
</html>
